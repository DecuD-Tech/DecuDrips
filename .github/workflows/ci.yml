name: DecuDrip Monorepo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: Path change detection for monorepo optimization
  changes:
    name: Detect Changed Subsystems
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      widget: ${{ steps.filter.outputs.widget }}
      general: ${{ steps.filter.outputs.general }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Cargo.lock'
            frontend:
              - 'frontend/**'
            mobile:
              - 'mobile/**'
            widget:
              - 'widget/**'
            general:
              - '.github/workflows/**'
              - 'docs/**'
              - '*.md'

  # Job 2: General checks (Runs on every PR or doc change)
  general-checks:
    name: General Repository Checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check File Permissions & Structure
        run: |
          echo "Running repository-wide sanity checks..."
          test -f README.md || test -f ISSUES.md

  # Job 3: Backend Rust CI (Runs ONLY when backend/ changes)
  backend-ci:
    name: Backend Rust Check & Tests
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.general == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Cargo Check
        run: cargo check --manifest-path backend/Cargo.toml

      - name: Cargo Test (Unit & Logic Suite)
        run: cargo test --lib --manifest-path backend/Cargo.toml

  # Job 4: Frontend React CI (Runs ONLY when frontend/ changes)
  frontend-ci:
    name: Frontend React Build & Lint
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.general == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build

  # Job 5: Mobile Flutter CI (Runs ONLY when mobile/ changes)
  mobile-ci:
    name: Mobile Flutter Analyze
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' || needs.changes.outputs.general == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: mobile
        run: flutter analyze

  # Job 6: Widget Web Component CI (Runs ONLY when widget/ changes)
  widget-ci:
    name: Widget & Framework Plugins Check
    needs: changes
    if: ${{ needs.changes.outputs.widget == 'true' || needs.changes.outputs.general == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Widget Files
        working-directory: widget
        run: |
          test -f src/widget.js
          test -f src/fingerprint.js
